<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 215" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Does the misinformation penalty hold across belief in disputed claims?</title><desc id="fd-desc">Does the misinformation penalty hold across belief in disputed claims?. 2 conditions: True/neutral headline, Misinformation headline. Primary outcome: Share: chosen/likely to share the headline (infotype x belief tertile interaction).. Population: Adults in the US, recruited via online panel, in English and Spanish, with quotas by belief tertile.</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Proposed follow-up: Does the misinformation penalty hold across belief in disputed claims?</text>
<g>
<rect class="box" x="20" y="82.5" width="200" height="60" rx="6"/>
<text class="kicker" x="32" y="104.5">Population</text>
<text x="32" y="122.5">Adults in the US,</text>
<text x="32" y="140.5">recruited via online</text>
<text x="32" y="158.5">panel, in English and</text>
<text x="32" y="176.5">Spanish, with quotas</text>
</g>
<polygon class="box" points="280,88.5 316,112.5 280,136.5 244,112.5"/>
<path class="edge" d="M220,112.5 L242,112.5"/><text class="cap" x="231.0" y="106.5" text-anchor="middle">randomized</text>
<g id="arm-c_true" data-text="Respondent sees a true or neutral headline.">
<rect class="arm" x="360" y="30" width="300" height="78" rx="6"/>
<text x="372" y="52">True/neutral headline</text>
<text class="cap" x="372" y="70">Respondent sees a true or neutral</text>
<text class="cap" x="372" y="85">headline.</text>
</g>
<path class="edge" d="M318,112.5 L356,69.0"/>
<g id="arm-c_misinfo" data-text="Respondent sees a false headline.">
<rect class="arm" x="360" y="120" width="300" height="63" rx="6"/>
<text x="372" y="142">Misinformation headline</text>
<text class="cap" x="372" y="160">Respondent sees a false headline.</text>
</g>
<path class="edge" d="M318,112.5 L356,151.5"/>
<g>
<rect class="box" x="700" y="52.5" width="240" height="120" rx="6"/>
<text class="kicker" x="712" y="74.5">Primary outcome</text>
<text x="712" y="92.5">Share: chosen/likely to</text>
<text x="712" y="110.5">share the headline</text>
<text x="712" y="128.5">(infotype x belief tertile</text>
<text x="712" y="146.5">interaction).</text>
</g>
<path class="edge" d="M660,112.5 L696,112.5"/></svg>