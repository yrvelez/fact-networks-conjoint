<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Randomized source cues and separate sharing and belief measures</title><desc id="fd-desc">Randomized source cues and separate sharing and belief measures. 3 conditions: True headline, False headline, Fact-check headline. Primary outcome: Sharing intent (1-7) minus perceived accuracy (1-7, standardized), and each rating separately.. Population: US Latino adults from YouGov, stratified by survey language (English or Spanish).</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Proposed follow-up: Randomized source cues and separate sharing and belief measures</text>
<g>
<rect class="box" x="20" y="135.0" width="200" height="60" rx="6"/>
<text class="kicker" x="32" y="157.0">Population</text>
<text x="32" y="175.0">US Latino adults from</text>
<text x="32" y="193.0">YouGov, stratified by</text>
<text x="32" y="211.0">survey language</text>
<text x="32" y="229.0">(English or Spanish).</text>
</g>
<polygon class="box" points="280,141.0 316,165.0 280,189.0 244,165.0"/>
<path class="edge" d="M220,165.0 L242,165.0"/><text class="cap" x="231.0" y="159.0" text-anchor="middle">randomized</text>
<g id="arm-c_true" data-text="A true headline attributed to the contact, with tie and trust randomized within the arm.">
<rect class="arm" x="360" y="30" width="300" height="78" rx="6"/>
<text x="372" y="52">True headline</text>
<text class="cap" x="372" y="70">A true headline attributed to the</text>
<text class="cap" x="372" y="85">contact, with tie and trust randomized</text>
</g>
<path class="edge" d="M318,165.0 L356,69.0"/>
<g id="arm-c_false" data-text="A false headline attributed to the contact, with tie and trust randomized within the arm.">
<rect class="arm" x="360" y="120" width="300" height="78" rx="6"/>
<text x="372" y="142">False headline</text>
<text class="cap" x="372" y="160">A false headline attributed to the</text>
<text class="cap" x="372" y="175">contact, with tie and trust randomized</text>
</g>
<path class="edge" d="M318,165.0 L356,159.0"/>
<g id="arm-c_fc" data-text="A fact-check headline attributed to the contact, with tie and trust randomized within the arm.">
<rect class="arm" x="360" y="210" width="300" height="78" rx="6"/>
<text x="372" y="232">Fact-check headline</text>
<text class="cap" x="372" y="250">A fact-check headline attributed to the</text>
<text class="cap" x="372" y="265">contact, with tie and trust randomized</text>
</g>
<path class="edge" d="M318,165.0 L356,249.0"/>
<g>
<rect class="box" x="700" y="105.0" width="240" height="120" rx="6"/>
<text class="kicker" x="712" y="127.0">Primary outcome</text>
<text x="712" y="145.0">Sharing intent (1-7) minus</text>
<text x="712" y="163.0">perceived accuracy (1-7,</text>
<text x="712" y="181.0">standardized), and each</text>
<text x="712" y="199.0">rating separately.</text>
</g>
<path class="edge" d="M660,165.0 L696,165.0"/></svg>