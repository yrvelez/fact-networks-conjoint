<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Randomized sharer profiles for trust and closeness</title><desc id="fd-desc">Randomized sharer profiles for trust and closeness. 4 conditions: Close, high trust, Close, low trust, Distant, high trust, Distant, low trust. Primary outcome: Sharing likelihood (0-100), with &#x27;would not share&#x27; analysed separately as a binary outcome.. Population: Quota-sampled US adults (age, gender, race, party)</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Proposed follow-up: Randomized sharer profiles for trust and closeness</text>
<g>
<rect class="box" x="20" y="180.0" width="200" height="60" rx="6"/>
<text class="kicker" x="32" y="202.0">Population</text>
<text x="32" y="220.0">Quota-sampled US</text>
<text x="32" y="238.0">adults (age, gender,</text>
<text x="32" y="256.0">race, party)</text>
</g>
<polygon class="box" points="280,186.0 316,210.0 280,234.0 244,210.0"/>
<path class="edge" d="M220,210.0 L242,210.0"/><text class="cap" x="231.0" y="204.0" text-anchor="middle">randomized</text>
<g id="arm-c_close_hi" data-text="Sharer is a close contact who is highly trustworthy.">
<rect class="arm" x="360" y="30" width="300" height="78" rx="6"/>
<text x="372" y="52">Close, high trust</text>
<text class="cap" x="372" y="70">Sharer is a close contact who is highly</text>
<text class="cap" x="372" y="85">trustworthy.</text>
</g>
<path class="edge" d="M318,210.0 L356,69.0"/>
<g id="arm-c_close_lo" data-text="Sharer is a close contact who is not very trustworthy.">
<rect class="arm" x="360" y="120" width="300" height="78" rx="6"/>
<text x="372" y="142">Close, low trust</text>
<text class="cap" x="372" y="160">Sharer is a close contact who is not very</text>
<text class="cap" x="372" y="175">trustworthy.</text>
</g>
<path class="edge" d="M318,210.0 L356,159.0"/>
<g id="arm-c_dist_hi" data-text="Sharer is a distant acquaintance who is highly trustworthy.">
<rect class="arm" x="360" y="210" width="300" height="78" rx="6"/>
<text x="372" y="232">Distant, high trust</text>
<text class="cap" x="372" y="250">Sharer is a distant acquaintance who is</text>
<text class="cap" x="372" y="265">highly trustworthy.</text>
</g>
<path class="edge" d="M318,210.0 L356,249.0"/>
<g id="arm-c_dist_lo" data-text="Sharer is a distant acquaintance who is not very trustworthy.">
<rect class="arm" x="360" y="300" width="300" height="78" rx="6"/>
<text x="372" y="322">Distant, low trust</text>
<text class="cap" x="372" y="340">Sharer is a distant acquaintance who is</text>
<text class="cap" x="372" y="355">not very trustworthy.</text>
</g>
<path class="edge" d="M318,210.0 L356,339.0"/>
<g>
<rect class="box" x="700" y="150.0" width="240" height="120" rx="6"/>
<text class="kicker" x="712" y="172.0">Primary outcome</text>
<text x="712" y="190.0">Sharing likelihood (0-100),</text>
<text x="712" y="208.0">with &#x27;would not share&#x27;</text>
<text x="712" y="226.0">analysed separately as a</text>
<text x="712" y="244.0">binary outcome.</text>
</g>
<path class="edge" d="M660,210.0 L696,210.0"/></svg>