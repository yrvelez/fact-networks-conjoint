<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Belief-driven versus identity-driven sharing of misinformation</title><desc id="fd-desc">Belief-driven versus identity-driven sharing of misinformation. 3 conditions: Co-ideological source, Opposed source, Neutral source. Primary outcome: Difference between sharing intent and accuracy rating (both standardized), by source condition, headline veracity and belief tertile.. Population: US adults, quota-sampled to include conservatives, moderates and liberals, with Latino adults oversampled. About 1,500 per arm.</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Proposed follow-up: Belief-driven versus identity-driven sharing of misinformation</text>
<g>
<rect class="box" x="20" y="135.0" width="200" height="60" rx="6"/>
<text class="kicker" x="32" y="157.0">Population</text>
<text x="32" y="175.0">US adults, quota-</text>
<text x="32" y="193.0">sampled to include</text>
<text x="32" y="211.0">conservatives,</text>
<text x="32" y="229.0">moderates and</text>
</g>
<polygon class="box" points="280,141.0 316,165.0 280,189.0 244,165.0"/>
<path class="edge" d="M220,165.0 L242,165.0"/><text class="cap" x="231.0" y="159.0" text-anchor="middle">randomized</text>
<g id="arm-co" data-text="Headlines attributed to an outlet matching the respondent&#x27;s ideology.">
<rect class="arm" x="360" y="30" width="300" height="78" rx="6"/>
<text x="372" y="52">Co-ideological source</text>
<text class="cap" x="372" y="70">Headlines attributed to an outlet</text>
<text class="cap" x="372" y="85">matching the respondent&#x27;s ideology.</text>
</g>
<path class="edge" d="M318,165.0 L356,69.0"/>
<g id="arm-opp" data-text="Headlines attributed to an outlet of the opposite ideology.">
<rect class="arm" x="360" y="120" width="300" height="78" rx="6"/>
<text x="372" y="142">Opposed source</text>
<text class="cap" x="372" y="160">Headlines attributed to an outlet of the</text>
<text class="cap" x="372" y="175">opposite ideology.</text>
</g>
<path class="edge" d="M318,165.0 L356,159.0"/>
<g id="arm-neu" data-text="Headlines attributed to a non-ideological outlet.">
<rect class="arm" x="360" y="210" width="300" height="78" rx="6"/>
<text x="372" y="232">Neutral source</text>
<text class="cap" x="372" y="250">Headlines attributed to a non-ideological</text>
<text class="cap" x="372" y="265">outlet.</text>
</g>
<path class="edge" d="M318,165.0 L356,249.0"/>
<g>
<rect class="box" x="700" y="105.0" width="240" height="120" rx="6"/>
<text class="kicker" x="712" y="127.0">Primary outcome</text>
<text x="712" y="145.0">Difference between sharing</text>
<text x="712" y="163.0">intent and accuracy rating</text>
<text x="712" y="181.0">(both standardized), by</text>
<text x="712" y="199.0">source condition, headline</text>
</g>
